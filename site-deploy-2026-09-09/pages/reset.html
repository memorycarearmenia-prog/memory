<!--{ "route": "/en/account/reset/", "title": "Password recovery", "description": "Recover access to your MemoryCare account.", "pageClass": "reset" }-->
<div class="main">
  <div class="auth">
    <div class="auth__panel">
      <div class="auth__card">
        <fieldset>
          <legend>Password recovery</legend>
          <p class="lead">Enter the e-mail you registered with. We will send a link to choose a new password.</p>
          <form id="reset">
            <label class="field__hint" for="rs-email" style="font-weight:600;color:var(--anthracite-2);font-size:.82rem">E-mail</label>
            <input type="text" name="email" id="rs-email" placeholder="you@example.com" class="txt" autocomplete="email" inputmode="email">
            <input type="hidden" name="lang" value="en">
            <button class="btn btn--primary" style="margin-top:0;">Send recovery link<span class="btn__cap" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg></span></button>
            <p id="resres"></p>
            <p class="reslink"><a href="/en/account/login/">Back to sign in</a></p>
          </form>
        </fieldset>
      </div>
    </div>
    <div class="auth__aside">
      <img src="/assets/img/alley.jpg" alt="">
      <div><h2>We keep it simple.</h2><p>One link, one new password. If the e-mail is not registered, nothing is sent.</p></div>
    </div>
  </div>
</div>
